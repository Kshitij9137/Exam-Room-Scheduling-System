{% load dashboard_tags %}
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand fw-semibold" href="{% url 'dashboard:home' %}">Exam &amp; Room Scheduler</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <div class="navbar-nav me-auto d-lg-none">
        <a class="nav-link" href="{% url 'dashboard:timetable' %}">Timetable</a>
        <a class="nav-link" href="{% url 'dashboard:student_lookup' %}">Student lookup</a>
        <a class="nav-link" href="{% url 'dashboard:exceptions' %}">Exceptions</a>
        <a class="nav-link" href="{% url 'dashboard:validation' %}">Validation</a>
        <a class="nav-link" href="{% url 'dashboard:conflict_graph' %}">Conflict graph</a>
      </div>
      <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        {% if user.is_authenticated %}
          <span class="navbar-text small">{{ user.get_username }}</span>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light">Sign out</button>
          </form>
        {% else %}
          <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Sign in</a>
        {% endif %}
        {% if user|can_run_actions %}<a class="btn btn-sm btn-outline-light" href="/admin/">Admin</a>{% endif %}
      </div>
    </div>
  </div>
</nav>
